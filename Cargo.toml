[package]
name = "crap4ts"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "A small CRAP score analyzer for TypeScript and TSX powered by Oxc"
license = "MIT"
repository = "https://github.com/fine405/crap4ts"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
oxc_allocator = "0.147"
oxc_ast = "0.147"
oxc_ast_visit = "0.147"
oxc_parser = "0.147"
oxc_span = "0.147"
oxc_syntax = "0.147"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.23"

[profile.release]
strip = true
lto = "thin"
